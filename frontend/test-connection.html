<!DOCTYPE html>
<html>
<head>
    <title>Test Connection</title>
</head>
<body>
    <h1>Test Connection to Django Backend</h1>
    <button id="test-btn">Test API Connection</button>
    <div id="result"></div>

    <script>
        document.getElementById('test-btn').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            fetch('http://127.0.0.1:8000/api/users/', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (response.status === 401) {
                    resultDiv.innerHTML = '✅ Connection successful! API is running but requires authentication.';
                } else if (response.ok) {
                    resultDiv.innerHTML = '✅ Connection successful! API is accessible.';
                } else {
                    resultDiv.innerHTML = `⚠️ API responded with status: ${response.status}`;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `❌ Connection failed: ${error.message}`;
            });
        });
    </script>
</body>
</html>
