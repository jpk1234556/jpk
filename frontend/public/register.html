<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Property Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/properties.css">
    <style>
        .register-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .register-header h1 {
            color: var(--december-gold);
            margin-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--december-navy);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--december-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        
        .btn-register {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--december-gold), var(--december-red));
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, var(--december-red), var(--december-gold));
        }
        
        .register-footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .register-footer a {
            color: var(--december-gold);
            text-decoration: none;
        }
        
        .register-footer a:hover {
            text-decoration: underline;
            color: var(--december-red);
        }
        
        .success-message {
            color: var(--december-green);
            background-color: #f2f9f2;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-message {
            color: var(--december-red);
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .note {
            background-color: var(--december-cream);
            border-left: 4px solid var(--december-gold);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>
    <div class="register-container card">
        <div class="register-header">
            <h1>Property Management System</h1>
            <p>Create a new property owner account</p>
        </div>
        
        <div id="success-message" class="success-message"></div>
        <div id="error-message" class="error-message"></div>
        
        <div class="note">
            <p><strong>Note:</strong> Your account will need to be approved by an administrator before you can log in.</p>
        </div>
        
        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit" class="btn-register">Register Account</button>
        </form>
        
        <div class="register-footer">
            <p><a href="login.html">Already have an account? Sign In</a></p>
            <p><a href="landing.html">Back to Home</a></p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Property Management System</p>
        </div>
    </footer>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            
            // Hide any previous messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match. Please try again.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Create user data
            const userData = {
                username: username,
                email: email,
                password: password,
                role: 'property_owner'  // Automatically set role to property_owner
            };
            
            // Send registration request to Django backend
            fetch('http://127.0.0.1:8000/api/users/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.detail || 'Registration failed');
                    });
                }
                return response.json();
            })
            .then(data => {
                // Show success message
                successMessage.textContent = 'Registration successful! Your account is pending approval by an administrator. You will receive an email notification when your account is approved.';
                successMessage.style.display = 'block';
                
                // Reset form
                document.getElementById('register-form').reset();
            })
            .catch(error => {
                console.error('Registration error:', error);
                errorMessage.textContent = error.message || 'Registration failed. Please try again.';
                errorMessage.style.display = 'block';
            });
        });
    </script>
</body>
</html>
