<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Property Management System</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <style>
        .admin-header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
        }
        
        .admin-container {
            display: flex;
            min-height: calc(100vh - 120px);
        }
        
        .sidebar {
            width: 250px;
            background-color: #34495e;
            color: white;
            padding: 1rem;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        
        .sidebar ul li {
            margin-bottom: 0.5rem;
        }
        
        .sidebar ul li a {
            color: #ecf0f1;
            text-decoration: none;
            display: block;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background-color: #2c3e50;
        }
        
        .main-content {
            flex: 1;
            padding: 2rem;
            background-color: #ecf0f1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #e67e22;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .admin-table th, .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .admin-table th {
            background-color: #34495e;
            color: white;
        }
        
        .admin-table tr:last-child td {
            border-bottom: none;
        }
        
        .admin-table tr:hover {
            background-color: #f5f5f5;
        }
        
        .action-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        
        .approve-btn {
            background-color: #27ae60;
            color: white;
        }
        
        .reject-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .view-btn {
            background-color: #3498db;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            font-style: italic;
            color: #7f8c8d;
        }
        
        .error-message {
            color: #e74c3c;
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 1rem;
            margin: 1rem 0;
            display: none;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .sidebar ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .sidebar ul li {
                margin: 0.5rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .recent-activity, .quick-actions {
                grid-column: 1;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .page-header h1 {
                margin-bottom: 1rem;
            }
            
            .search-box input[type="text"] {
                width: 100%;
            }
            
            .filter-group {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            .filter-group select {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 1rem;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            .stats-card h3 {
                font-size: 1rem;
            }
            
            .stats-card .value {
                font-size: 1.5rem;
            }
            
            .admin-table {
                font-size: 0.9rem;
            }
            
            .admin-table th,
            .admin-table td {
                padding: 0.5rem;
            }
            
            .action-btn {
                padding: 0.25rem 0.5rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h1>Property Management System - Admin Dashboard</h1>
        </div>
    </header>

    <div class="admin-container">
        <aside class="sidebar">
            <h2>Admin Menu</h2>
            <ul>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="property-owners.html">Property Owners</a></li>
                <li><a href="properties.html">All Properties</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" id="logout-link">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div id="error-message" class="error-message"></div>
            
            <h1>Admin Dashboard</h1>
            
            <div id="dashboard-content">
                <div class="loading">Loading dashboard data...</div>
            </div>
        </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Property Management System - Admin Module</p>
        </div>
    </footer>

    <script>
        // Check if user is authenticated
        const authToken = localStorage.getItem('authToken');
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if (!authToken || !currentUser) {
            // Redirect to login if not authenticated
            window.location.href = '../public/login.html';
        }
        
        // Handle logout
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            
            fetch('http://127.0.0.1:8000/api/users/logout/', {
                method: 'POST',
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(() => {
                // Clear local storage and redirect to login
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                window.location.href = '../public/login.html';
            })
            .catch(error => {
                console.error('Logout error:', error);
                // Still clear local storage and redirect
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                window.location.href = '../public/login.html';
            });
        });
        
        // Load dashboard data
        function loadDashboardData() {
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';
            
            // Fetch dashboard statistics from the new organized endpoint
            fetch('http://127.0.0.1:8000/api/admin-module/dashboard-stats/', {
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                return response.json();
            })
            .then(stats => {
                // Fetch users for property owner approvals
                return fetch('http://127.0.0.1:8000/api/users/', {
                    headers: {
                        'Authorization': `Token ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch users');
                    }
                    return response.json();
                })
                .then(users => {
                    const propertyOwners = users.filter(user => user.role === 'property_owner');
                    renderDashboard(stats, propertyOwners);
                });
            })
            .catch(error => {
                console.error('Error loading dashboard data:', error);
                errorMessage.textContent = 'Failed to load dashboard data. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('dashboard-content').innerHTML = '<div class="loading">Failed to load data</div>';
            });
        }
        
        function renderDashboard(stats, propertyOwners) {
            const content = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Property Owners</h3>
                        <div class="value">${stats.totalOwners}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Properties</h3>
                        <div class="value">${stats.totalProperties}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Approvals</h3>
                        <div class="value">${stats.pendingApprovals}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Active Tenants</h3>
                        <div class="value">${stats.activeTenants}</div>
                    </div>
                </div>
                
                <h2>Pending Property Owner Approvals</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${propertyOwners.filter(owner => !owner.is_approved).map(owner => `
                            <tr>
                                <td>${owner.username}</td>
                                <td>${owner.email}</td>
                                <td>${new Date(owner.created_at).toLocaleDateString()}</td>
                                <td>
                                    <button class="action-btn approve-btn" data-user-id="${owner.id}">Approve</button>
                                    <button class="action-btn reject-btn" data-user-id="${owner.id}">Reject</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                
                <h2>Recent Activity</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Activity</th>
                            <th>User</th>
                            <th>Date</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>New Property Added</td>
                            <td>Sarah Hotel</td>
                            <td>2025-11-27 14:30</td>
                            <td>Lakeside Apartments</td>
                        </tr>
                        <tr>
                            <td>Maintenance Request</td>
                            <td>John Owner</td>
                            <td>2025-11-27 12:15</td>
                            <td>Plumbing issue in Unit 4B</td>
                        </tr>
                        <tr>
                            <td>Payment Received</td>
                            <td>Mike Owner</td>
                            <td>2025-11-27 10:45</td>
                            <td>$850 from Tenant Smith</td>
                        </tr>
                    </tbody>
                </table>
            `;
            
            document.getElementById('dashboard-content').innerHTML = content;
            
            // Add event listeners for approve/reject buttons
            document.querySelectorAll('.approve-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.getAttribute('data-user-id');
                    approveUser(userId);
                });
            });
            
            document.querySelectorAll('.reject-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.getAttribute('data-user-id');
                    rejectUser(userId);
                });
            });
        }
        
        function approveUser(userId) {
            fetch(`http://127.0.0.1:8000/api/users/${userId}/`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    is_approved: true
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to approve user');
                }
                return response.json();
            })
            .then(() => {
                // Reload dashboard data
                loadDashboardData();
            })
            .catch(error => {
                console.error('Error approving user:', error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Failed to approve user. Please try again.';
                errorMessage.style.display = 'block';
            });
        }
        
        function rejectUser(userId) {
            if (confirm('Are you sure you want to reject this property owner?')) {
                fetch(`http://127.0.0.1:8000/api/users/${userId}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Token ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to reject user');
                    }
                    // Reload dashboard data
                    loadDashboardData();
                })
                .catch(error => {
                    console.error('Error rejecting user:', error);
                    const errorMessage = document.getElementById('error-message');
                    errorMessage.textContent = 'Failed to reject user. Please try again.';
                    errorMessage.style.display = 'block';
                });
            }
        }
        
        // Load dashboard data when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
        });
    </script>
</body>
</html>
