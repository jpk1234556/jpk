<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - Admin Module</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <style>
        .properties-container {
            display: flex;
            min-height: calc(100vh - 120px);
        }
        
        .main-content {
            flex: 1;
            padding: 2rem;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .btn-primary {
            background-color: #FFA500;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary:hover {
            background-color: #FF8C00;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        
        .admin-table th,
        .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #E0E0E0;
        }
        
        .admin-table th {
            background-color: #F5F5F5;
            font-weight: bold;
        }
        
        .admin-table tr:hover {
            background-color: #F9F9F9;
        }
        
        .action-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        
        .edit-btn {
            background-color: #3498db;
            color: white;
        }
        
        .delete-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .action-btn:hover {
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .error-message {
            color: #e74c3c;
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 8px;
            width: 600px;
            max-width: 90%;
        }
        
        .close {
            float: right;
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E0E0E0;
            border-radius: 4px;
        }
        
        .btn-submit {
            background-color: #FFA500;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-submit:hover {
            background-color: #FF8C00;
        }
        
        .search-box {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .search-box input,
        .search-box select {
            padding: 0.75rem;
            border: 1px solid #E0E0E0;
            border-radius: 4px;
        }
        
        .search-box input[type="text"] {
            width: 300px;
        }
        
        .search-box select {
            width: 150px;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .filter-group label {
            font-weight: bold;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .properties-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .sidebar ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .sidebar ul li {
                margin: 0.5rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .page-header h1 {
                margin-bottom: 1rem;
            }
            
            .page-header .btn-primary {
                align-self: flex-start;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .search-box input[type="text"] {
                width: 100%;
            }
            
            .filter-group {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            .filter-group select {
                width: 100%;
            }
            
            .admin-table {
                display: block;
                overflow-x: auto;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 1rem;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            .admin-table {
                font-size: 0.9rem;
            }
            
            .admin-table th,
            .admin-table td {
                padding: 0.5rem;
            }
            
            .action-btn {
                padding: 0.25rem 0.5rem;
                font-size: 0.8rem;
                margin-bottom: 0.25rem;
            }
            
            .modal-content {
                width: 95%;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Property Management System - Admin Module</h1>
        </div>
    </header>

    <div class="properties-container">
        <aside class="sidebar">
            <h2>Admin Menu</h2>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="property-owners.html">Property Owners</a></li>
                <li><a href="properties.html" class="active">All Properties</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" id="logout-link">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div id="error-message" class="error-message"></div>
            
            <div class="page-header">
                <h1>Properties Management</h1>
                <button id="add-property-btn" class="btn-primary">Add New Property</button>
            </div>
            
            <div class="search-box">
                <div class="filter-group">
                    <input type="text" id="search-input" placeholder="Search properties...">
                </div>
                <div class="filter-group">
                    <label for="property-type-filter">Type:</label>
                    <select id="property-type-filter">
                        <option value="">All Types</option>
                        <option value="hostel">Hostel</option>
                        <option value="apartment">Apartment</option>
                        <option value="hotel">Hotel</option>
                        <option value="rental">Rental</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="property-owner-filter">Owner:</label>
                    <select id="property-owner-filter">
                        <option value="">All Owners</option>
                    </select>
                </div>
                <button id="clear-filters" class="action-btn">Clear Filters</button>
            </div>
            
            <div id="properties-content">
                <div class="loading">Loading properties...</div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Property Modal -->
    <div id="property-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Add Property</h2>
            <form id="property-form">
                <input type="hidden" id="property-id">
                <div class="form-group">
                    <label for="property-name">Property Name</label>
                    <input type="text" id="property-name" required>
                </div>
                <div class="form-group">
                    <label for="property-type">Property Type</label>
                    <select id="property-type" required>
                        <option value="">Select Type</option>
                        <option value="hostel">Hostel</option>
                        <option value="apartment">Apartment</option>
                        <option value="hotel">Hotel</option>
                        <option value="rental">Rental</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="property-address">Address</label>
                    <textarea id="property-address" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="property-owner">Property Owner</label>
                    <select id="property-owner" required>
                        <option value="">Select Owner</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Save Property</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Property Management System - Admin Module</p>
        </div>
    </footer>

    <script>
        // Check if user is authenticated
        const authToken = localStorage.getItem('authToken');
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if (!authToken || !currentUser) {
            // Redirect to login if not authenticated
            window.location.href = '../public/login.html';
        }
        
        // Handle logout
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            
            fetch('http://127.0.0.1:8000/api/users/logout/', {
                method: 'POST',
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(() => {
                // Clear local storage and redirect to login
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                window.location.href = '../public/login.html';
            })
            .catch(error => {
                console.error('Logout error:', error);
                // Still clear local storage and redirect
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                window.location.href = '../public/login.html';
            });
        });
        
        // Load properties and property owners
        function loadProperties() {
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';
            
            // Fetch properties
            fetch('http://127.0.0.1:8000/api/properties/', {
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch properties');
                }
                return response.json();
            })
            .then(properties => {
                // Fetch property owners for the dropdown
                return fetch('http://127.0.0.1:8000/api/users/?role=property_owner', {
                    headers: {
                        'Authorization': `Token ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch property owners');
                    }
                    return response.json();
                })
                .then(owners => {
                    renderProperties(properties, owners);
                });
            })
            .catch(error => {
                console.error('Error loading properties:', error);
                errorMessage.textContent = 'Failed to load properties. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('properties-content').innerHTML = '<div class="loading">Failed to load data</div>';
            });
        }
        
        function renderProperties(properties, owners) {
            // Populate property owners dropdown for the filter
            const ownerFilterSelect = document.getElementById('property-owner-filter');
            ownerFilterSelect.innerHTML = '<option value="">All Owners</option>';
            owners.forEach(owner => {
                if (owner.is_approved) {
                    const option = document.createElement('option');
                    option.value = owner.username.toLowerCase();
                    option.textContent = owner.username;
                    ownerFilterSelect.appendChild(option);
                }
            });
            
            // Populate property owners dropdown for the form
            const ownerSelect = document.getElementById('property-owner');
            ownerSelect.innerHTML = '<option value="">Select Owner</option>';
            owners.forEach(owner => {
                if (owner.is_approved) {
                    const option = document.createElement('option');
                    option.value = owner.id;
                    option.textContent = owner.username;
                    ownerSelect.appendChild(option);
                }
            });
            
            const content = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Owner</th>
                            <th>Units</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${properties.map(property => `
                            <tr>
                                <td>${property.name}</td>
                                <td>${property.type.charAt(0).toUpperCase() + property.type.slice(1)}</td>
                                <td>${owners.find(o => o.id === property.owner)?.username || 'Unknown'}</td>
                                <td>${Math.floor(Math.random() * 20) + 1}</td>
                                <td>${property.address || 'N/A'}</td>
                                <td>
                                    <button class="action-btn edit-btn" data-property-id="${property.id}">Edit</button>
                                    <button class="action-btn delete-btn" data-property-id="${property.id}">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('properties-content').innerHTML = content;
            
            // Add event listeners for action buttons
            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const propertyId = this.getAttribute('data-property-id');
                    editProperty(propertyId);
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const propertyId = this.getAttribute('data-property-id');
                    if (confirm('Are you sure you want to delete this property?')) {
                        deleteProperty(propertyId);
                    }
                });
            });
            
            // Re-attach filter event listeners after rendering
            applyFilters();
        }
        
        function deleteProperty(propertyId) {
            fetch(`http://127.0.0.1:8000/api/properties/${propertyId}/`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to delete property');
                }
                // Reload properties data
                loadProperties();
            })
            .catch(error => {
                console.error('Error deleting property:', error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Failed to delete property. Please try again.';
                errorMessage.style.display = 'block';
            });
        }
        
        function editProperty(propertyId) {
            // Fetch property details
            fetch(`http://127.0.0.1:8000/api/properties/${propertyId}/`, {
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch property details');
                }
                return response.json();
            })
            .then(property => {
                // Populate form with property data
                document.getElementById('property-id').value = property.id;
                document.getElementById('property-name').value = property.name;
                document.getElementById('property-type').value = property.type;
                document.getElementById('property-address').value = property.address || '';
                document.getElementById('property-owner').value = property.owner;
                
                // Update modal title
                document.getElementById('modal-title').textContent = 'Edit Property';
                
                // Show modal
                document.getElementById('property-modal').style.display = 'block';
            })
            .catch(error => {
                console.error('Error fetching property details:', error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Failed to load property details. Please try again.';
                errorMessage.style.display = 'block';
            });
        }
        
        // Modal functionality
        const modal = document.getElementById('property-modal');
        const addPropertyBtn = document.getElementById('add-property-btn');
        const closeBtn = document.querySelector('.close');
        
        addPropertyBtn.addEventListener('click', function() {
            // Reset form
            document.getElementById('property-form').reset();
            document.getElementById('property-id').value = '';
            document.getElementById('modal-title').textContent = 'Add Property';
            modal.style.display = 'block';
        });
        
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
        
        // Handle form submission
        document.getElementById('property-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const propertyId = document.getElementById('property-id').value;
            const name = document.getElementById('property-name').value;
            const type = document.getElementById('property-type').value;
            const address = document.getElementById('property-address').value;
            const owner = document.getElementById('property-owner').value;
            
            const propertyData = {
                name: name,
                type: type,
                address: address,
                owner: parseInt(owner)
            };
            
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';
            
            let url, method;
            if (propertyId) {
                // Update existing property
                url = `http://127.0.0.1:8000/api/properties/${propertyId}/`;
                method = 'PUT';
            } else {
                // Create new property
                url = 'http://127.0.0.1:8000/api/properties/';
                method = 'POST';
            }
            
            fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Token ${authToken}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(propertyData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.detail || 'Operation failed');
                    });
                }
                return response.json();
            })
            .then(() => {
                // Close modal and reload data
                modal.style.display = 'none';
                loadProperties();
            })
            .catch(error => {
                console.error('Error saving property:', error);
                errorMessage.textContent = error.message || 'Failed to save property. Please try again.';
                errorMessage.style.display = 'block';
            });
        });
        
        // Enhanced search and filter functionality
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const typeFilter = document.getElementById('property-type-filter').value;
            const ownerFilter = document.getElementById('property-owner-filter').value;
            
            const rows = document.querySelectorAll('#properties-content tbody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                const typeCell = row.cells[1]; // Type column
                const type = typeCell ? typeCell.textContent.toLowerCase() : '';
                const ownerCell = row.cells[2]; // Owner column
                const owner = ownerCell ? ownerCell.textContent.toLowerCase() : '';
                
                const matchesSearch = text.includes(searchTerm);
                const matchesType = !typeFilter || type.includes(typeFilter);
                const matchesOwner = !ownerFilter || owner.includes(ownerFilter);
                
                row.style.display = (matchesSearch && matchesType && matchesOwner) ? '' : 'none';
            });
        }
        
        // Event listeners for filters
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('property-type-filter').addEventListener('change', applyFilters);
        document.getElementById('property-owner-filter').addEventListener('change', applyFilters);
        
        document.getElementById('clear-filters').addEventListener('click', function() {
            document.getElementById('search-input').value = '';
            document.getElementById('property-type-filter').value = '';
            document.getElementById('property-owner-filter').value = '';
            applyFilters();
        });
        
        // Load properties when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadProperties();
        });
    </script>
</body>
</html>
