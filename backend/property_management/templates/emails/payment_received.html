<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Received</title>
</head>
<body>
    <h2>Payment Received</h2>
    <p>Hello {{ tenant.name }},</p>
    
    <p>We have received your payment of ${{ amount }} on {{ payment_date }}.</p>
    
    <p>View your receipt: <a href="{{ receipt_url }}">View Receipt</a></p>
    
    <p>Thank you for your payment,<br>The Property Management Team</p>
</body>
</html>
